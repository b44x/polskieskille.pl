name: validate-site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_seo.py --check
      - run: python3 scripts/validate_site.py
      - run: python3 scripts/test_seo.py
